<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in | Emphile Back Office</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
</head>
<body>
<div class="center">
  <form class="login" id="lf">
    <h1>Back office sign in</h1>
    <p class="muted">Emphile Engineering Services staff only.</p>
    <div class="msg" id="err" hidden></div>
    <div><label for="em">Email</label><input id="em" type="email" required autocomplete="username"></div>
    <div><label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password"></div>
    <button class="btn y" type="submit" style="justify-content:center">Sign in</button>
    <a class="muted" href="../index.html" style="font-size:.85rem">← Back to website</a>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script>
  const C = window.EMPHILE_CONFIG || {}, err = document.getElementById('err');
  const sb = C.url && C.key ? supabase.createClient(C.url, C.key) : null;
  if (!sb) { err.hidden = false; err.textContent = 'Not connected: add the Supabase URL and key to config.js.'; }
  document.getElementById('lf').onsubmit = async e => {
    e.preventDefault(); if (!sb) return;
    const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value });
    if (error) { err.hidden = false; err.textContent = error.message; } else location.href = 'index.html';
  };
</script>
</body>
</html>
